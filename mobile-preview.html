<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone preview</title>
  <style>
    /* Shows the real site in a phone-sized frame (iPhone 16 Pro: 402 × 874), for checking on a computer.
       On a real phone, just open index.html */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eeeeee;
    }

    iframe {
      width: 402px;
      height: 874px;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <iframe src="index.html" title="Phone preview"></iframe>
</body>
</html>
